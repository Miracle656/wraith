services:
  # ── Postgres ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: wraith_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wraith
      POSTGRES_PASSWORD: wraith
      POSTGRES_DB: wraith
    ports:
      - "5432:5432"
    volumes:
      - wraith_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wraith"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (optional, for response cache) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: wraith_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - cache

  # ── Wraith Indexer + API ───────────────────────────────────
  wraith:
    build: .
    container_name: wraith_indexer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: postgresql://wraith:wraith@db:5432/wraith
      DIRECT_DATABASE_URL: postgresql://wraith:wraith@db:5432/wraith
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-}
      NETWORKS: ${NETWORKS:-}
      START_LEDGER: ${START_LEDGER:-}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-6000}
      OHLC_REFRESH_INTERVAL_MS: ${OHLC_REFRESH_INTERVAL_MS:-0}
      SAC_CONTRACT_IDS: ${SAC_CONTRACT_IDS:-}
      SAC_CONTRACT_IDS_TESTNET: ${SAC_CONTRACT_IDS_TESTNET:-}
      SAC_CONTRACT_IDS_MAINNET: ${SAC_CONTRACT_IDS_MAINNET:-}
      CONTRACT_IDS: ${CONTRACT_IDS:-}
      NFT_CONTRACT_IDS: ${NFT_CONTRACT_IDS:-}
      NFT_CONTRACT_IDS_TESTNET: ${NFT_CONTRACT_IDS_TESTNET:-}
      NFT_CONTRACT_IDS_MAINNET: ${NFT_CONTRACT_IDS_MAINNET:-}
      EVENTS_BATCH_SIZE: ${EVENTS_BATCH_SIZE:-10000}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      PORT: ${PORT:-3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-wraith:cache:}
      CACHE_TTL_POPULAR_MS: ${CACHE_TTL_POPULAR_MS:-60000}
      CACHE_TTL_SEARCH_MS: ${CACHE_TTL_SEARCH_MS:-15000}
      TOMBSTONE_CHECK_EVERY_CYCLES: ${TOMBSTONE_CHECK_EVERY_CYCLES:-100}
      LP_POOL_CONTRACT_IDS: ${LP_POOL_CONTRACT_IDS:-}
      LP_POOL_CONTRACT_IDS_TESTNET: ${LP_POOL_CONTRACT_IDS_TESTNET:-}
      LP_POOL_CONTRACT_IDS_MAINNET: ${LP_POOL_CONTRACT_IDS_MAINNET:-}
      # Documented in .env.example and passed through unset by default, so a
      # compose run matches a host run. `src/__tests__/dockerCompose.test.ts`
      # fails if the two ever drift apart again.
      DATABASE_REPLICAS: ${DATABASE_REPLICAS:-}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-}
      GRAPHQL_MAX_COST: ${GRAPHQL_MAX_COST:-}
      GRAPHQL_MAX_DEPTH: ${GRAPHQL_MAX_DEPTH:-}
      HORIZON_EVENTS_PATH: ${HORIZON_EVENTS_PATH:-}
      HORIZON_URL: ${HORIZON_URL:-}
      HORIZON_URL_MAINNET: ${HORIZON_URL_MAINNET:-}
      HORIZON_URL_TESTNET: ${HORIZON_URL_TESTNET:-}
      LINQ_API_KEY: ${LINQ_API_KEY:-}
      LINQ_BASE_URL: ${LINQ_BASE_URL:-}
      LINQ_WEBHOOK_SECRET: ${LINQ_WEBHOOK_SECRET:-}
      NODE_ENV: ${NODE_ENV:-production}
      OFFRAMP_LOOKUP_MAX_FAILURES: ${OFFRAMP_LOOKUP_MAX_FAILURES:-}
      OFFRAMP_LOOKUP_WINDOW_MS: ${OFFRAMP_LOOKUP_WINDOW_MS:-}
      ORDER_RECONCILIATION_AGE_MS: ${ORDER_RECONCILIATION_AGE_MS:-}
      ORDER_RECONCILIATION_INTERVAL_MS: ${ORDER_RECONCILIATION_INTERVAL_MS:-}
      ORDER_RECONCILIATION_MAX_ATTEMPTS: ${ORDER_RECONCILIATION_MAX_ATTEMPTS:-}
      ORDER_RECONCILIATION_MAX_PROVIDER_CALLS: ${ORDER_RECONCILIATION_MAX_PROVIDER_CALLS:-}
      ORDER_RECONCILIATION_PAGE_SIZE: ${ORDER_RECONCILIATION_PAGE_SIZE:-}
      OPA_POLICY: ${OPA_POLICY:-}
      OPA_URL: ${OPA_URL:-}
      OPS_TOKEN: ${OPS_TOKEN:-}
      PARTITION_RETENTION_INTERVAL_MS: ${PARTITION_RETENTION_INTERVAL_MS:-}
      PERSISTED_QUERIES_PATH: ${PERSISTED_QUERIES_PATH:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      SOROBAN_RPC_URL_MAINNET: ${SOROBAN_RPC_URL_MAINNET:-}
      SOROBAN_RPC_URL_TESTNET: ${SOROBAN_RPC_URL_TESTNET:-}
      START_LEDGER_MAINNET: ${START_LEDGER_MAINNET:-}
      START_LEDGER_TESTNET: ${START_LEDGER_TESTNET:-}
      STELLAR_RPC_URL_MAINNET: ${STELLAR_RPC_URL_MAINNET:-}
      STELLAR_RPC_URL_TESTNET: ${STELLAR_RPC_URL_TESTNET:-}
      VEIL_FEE_AMOUNT: ${VEIL_FEE_AMOUNT:-}
      VEIL_FEE_AMOUNT_XLM: ${VEIL_FEE_AMOUNT_XLM:-}
      VEIL_FEE_ASSET_CODE: ${VEIL_FEE_ASSET_CODE:-}
      VEIL_FEE_ASSET_ISSUER: ${VEIL_FEE_ASSET_ISSUER:-}
      VEIL_FEE_DESTINATION: ${VEIL_FEE_DESTINATION:-}
      VEIL_FEE_MAX: ${VEIL_FEE_MAX:-}
      VEIL_FEE_MAX_XLM: ${VEIL_FEE_MAX_XLM:-}
      VEIL_FEE_MIN: ${VEIL_FEE_MIN:-}
      VEIL_FEE_MIN_XLM: ${VEIL_FEE_MIN_XLM:-}
      VEIL_FEE_PERCENT: ${VEIL_FEE_PERCENT:-}
      SKIP_INDEXER: ${SKIP_INDEXER:-false}
      VEIL_FEE_ALARM_PERCENT: ${VEIL_FEE_ALARM_PERCENT:-10}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      VEIL_FEE_REPORT_TOKEN: ${VEIL_FEE_REPORT_TOKEN:-}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  wraith_pgdata:
