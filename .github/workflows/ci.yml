name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci || npm install
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx tsc --noEmit
      - run: npm run build
      # The suite finishes in about half a minute. Anything still running a
      # quarter of an hour later is stuck on an open handle, not on tests — and
      # a stuck step with no deadline holds a runner for six hours while its
      # log stays unreadable, which is how a hang gets mistaken for CI being
      # slow. The timeout kills jest outright so the output collected up to
      # that point is flushed and downloadable.
      - name: Unit tests
        run: timeout -k 30s 900s npm test --if-present

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci || npm install
      - run: npx prisma generate
      - run: docker compose -f docker-compose.test.yml up -d --build
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://wraith:wraith@localhost:55432/wraith_test
          DIRECT_DATABASE_URL: postgresql://wraith:wraith@localhost:55432/wraith_test
          INTEGRATION_API_URL: http://localhost:3300
      - name: Tear down integration stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
